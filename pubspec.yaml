name: community_wall
description: "Muro de Mensajes Comunitario — micro-blogging con Flutter y Firebase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Firebase ────────────────────────────────────────────────────
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.4.1

  # ── State Management ────────────────────────────────────────────
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # ── Navigation ──────────────────────────────────────────────────
  go_router: ^17.2.3

  # ── Environment / Config ────────────────────────────────────────
  flutter_dotenv: ^6.0.1

  # ── Serialization ───────────────────────────────────────────────
  json_annotation: ^4.9.0

  # ── Images ──────────────────────────────────────────────────────
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # ── UI ──────────────────────────────────────────────────────────
  shimmer: ^3.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── Code Generation ─────────────────────────────────────────────
  build_runner: ^2.4.15
  riverpod_generator: ^4.0.0+1
  json_serializable: ^6.9.5
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
