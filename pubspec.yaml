name: community_wall
description: "Muro de Mensajes Comunitario — micro-blogging con Flutter y Firebase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Firebase ────────────────────────────────────────────────────
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.9
  firebase_storage: ^12.4.6

  # ── State Management ────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Navigation ──────────────────────────────────────────────────
  go_router: ^15.1.2

  # ── Environment / Config ────────────────────────────────────────
  flutter_dotenv: ^5.2.1

  # ── Serialization ───────────────────────────────────────────────
  json_annotation: ^4.9.0

  # ── Images ──────────────────────────────────────────────────────
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # ── UI ──────────────────────────────────────────────────────────
  shimmer: ^3.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── Code Generation ─────────────────────────────────────────────
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  json_serializable: ^6.9.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
